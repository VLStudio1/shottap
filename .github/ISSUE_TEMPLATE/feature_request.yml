name: Feature request
description: Suggest an improvement or new capability for ShotTap.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like ShotTap to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there workarounds or other approaches you've tried?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or details if useful. Please redact sensitive information before attaching files.
